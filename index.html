<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIT Message Counter</title>
    <meta
      name="description"
      content="Upload a Garmin FIT file and count how many decoded messages it contains."
    />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <p class="eyebrow">Garmin FIT Parser</p>
        <h1>Count messages in a .fit file</h1>
        <p class="lede">
          Upload a FIT activity file and this page will decode it locally in your browser.
        </p>
        <label class="upload-zone" for="fit-file">
          <span class="upload-title">Choose a FIT file</span>
          <span class="upload-copy">Tap to browse or replace the selected file.</span>
        </label>
        <input id="fit-file" class="file-input" type="file" accept=".fit,application/octet-stream" />
        <section class="results" data-role="results" aria-live="polite" hidden>
          <div class="summary-section">
            <p class="summary-heading">Overview</p>
            <dl class="summary-list">
              <div>
                <dt>File</dt>
                <dd data-role="file-name">No file selected</dd>
              </div>
              <div>
                <dt>Messages</dt>
                <dd data-role="message-count">-</dd>
              </div>
              <div>
                <dt>Status</dt>
                <dd data-role="status">Waiting for upload</dd>
              </div>
            </dl>
          </div>
          <div data-role="summary-groups"></div>
          <section class="summary-section interval-section">
            <p class="summary-heading">Intervals</p>
            <form class="interval-form" data-role="interval-form">
              <label class="field-group">
                <span>Interval Name</span>
                <input
                  id="interval-name"
                  name="interval-name"
                  type="text"
                  placeholder="Easy warmup"
                  data-role="interval-name"
                />
              </label>
              <label class="field-group">
                <span>Time in Seconds</span>
                <input
                  id="interval-seconds"
                  name="interval-seconds"
                  type="number"
                  min="1"
                  step="1"
                  placeholder="300"
                  data-role="interval-seconds"
                />
              </label>
              <button type="submit" class="primary-button">Add interval</button>
            </form>
            <p class="interval-feedback" data-role="interval-feedback">Add intervals for the loaded activity.</p>
            <div class="interval-list" data-role="interval-list"></div>
          </section>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
  </html>
